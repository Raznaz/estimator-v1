name: CI

# Проверки кода: на каждый PR и на push в main.
on:
  pull_request:
  push:
    branches: [main]

# Новый push в ту же ветку отменяет предыдущий незавершённый прогон —
# не тратим раннеры на устаревшие коммиты.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci ставит строго по package-lock.json — воспроизводимо и быстрее install.
      - name: Установка зависимостей
        run: npm ci

      # Структурная проверка спек: дельты, сценарии, ключевые слова SHALL/MUST.
      - name: Валидация спек
        env:
          OPENSPEC_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
        run: npm run spec:validate

      # Полнота артефактов: у каждой объявленной capability есть спека и задачи.
      # Встроенный openspec этого не проверяет — см. openspec/changes/archive-readiness-gate.
      - name: Готовность спек к архивации
        env:
          OPENSPEC_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
        run: npm run spec:ready

      # Корневой npm run test идёт по workspaces и файлы в scripts/ не покрывает.
      - name: Тесты гейта спек
        run: npm run spec:ready:test

      # Без сгенерированного Prisma Client не пройдут ни typecheck, ни сборка backend.
      - name: Генерация Prisma Client
        run: npx prisma generate --schema backend/prisma/schema.prisma

      - name: Линт
        run: npm run lint

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm run test

      - name: Сборка
        # Значение фиктивное: на этом шаге важно, что сборка проходит,
        # а реальный адрес API вшивается при сборке Docker-образа в deploy.yml.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run build
