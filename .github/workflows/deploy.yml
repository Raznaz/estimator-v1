name: Deploy

# Деплой на прод: после успешного прогона CI на main, и вручную из UI
# (вкладка Actions → Run workflow). Не триггеримся на push напрямую — иначе
# сборка и выкатка стартуют, даже если CI (линт/типы/тесты/сборка) упал.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Два деплоя одновременно на один сервер — гонка. Ставим в очередь, не отменяя:
# уже начатый деплой должен завершиться, иначе сервер останется в промежуточном виде.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # 1. Сборка образов и публикация в GitHub Container Registry.
  # ---------------------------------------------------------------------------
  build:
    name: Сборка образа (${{ matrix.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # право пушить в GHCR
    # Ручной запуск — всегда; автозапуск по workflow_run — только если CI
    # реально прошёл и это прогон именно на main (workflow_run срабатывает
    # и для CI на PR-ветках, их пропускаем).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main')
    outputs:
      sha: ${{ steps.sha.outputs.sha }}

    strategy:
      matrix:
        app: [backend, frontend]

    steps:
      # Под workflow_run коммит, который нужно собрать, — это коммит CI-прогона
      # (github.sha в этом событии указывает на сам workflow deploy.yml, а не на него).
      - name: Коммит для сборки
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: docker/setup-buildx-action@v4

      # Имя владельца в GitHub может содержать заглавные буквы (Raznaz),
      # а Docker требует имя репозитория строчными. Приводим здесь.
      - name: Имя владельца строчными буквами
        id: owner
        run: |
          lc=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "lc=$lc" >> "$GITHUB_OUTPUT"
          echo "Образы будут публиковаться в ghcr.io/$lc/estimator-*"

      - name: Логин в GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # выдаётся Actions автоматически

      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: . # контекст — корень монорепы
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/estimator-${{ matrix.app }}:${{ steps.sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.lc }}/estimator-${{ matrix.app }}:latest
          # Адрес API вшивается в бандл фронта на этапе сборки — поменять его
          # в рантайме нельзя. Для backend аргумент просто игнорируется.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 2. Выкатка на VPS по SSH.
  #    Включается переменной репозитория DEPLOY_ENABLED=true (см. infra/README.md).
  #    До настройки сервера образы просто собираются, а этот job пропускается.
  # ---------------------------------------------------------------------------
  deploy:
    name: Выкатка на сервер
    needs: build
    # Явно требуем успеха build: собственный `if` на job с needs отменяет
    # дефолтную проверку success() зависимостей, а build теперь может быть
    # skipped (см. его `if` выше) — без needs.build.result == 'success' здесь
    # мы бы выкатывали несобранные образы.
    if: vars.DEPLOY_ENABLED == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Обновление стека на сервере
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true # прервать при первой же ошибке
          script: |
            set -e
            cd /opt/estimator

            # Тег образов — SHA собранного коммита (не github.sha: под workflow_run
            # он указывает на сам deploy.yml, а не на закоммиченный код); пишем
            # в .env.prod, чтобы docker compose и последующие ручные команды
            # видели ту же версию.
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ needs.build.outputs.sha }}|" .env.prod

            docker compose -f docker-compose.prod.yml --env-file .env.prod pull

            # Миграции — отдельным одноразовым контейнером, ДО перезапуска сервисов.
            docker compose -f docker-compose.prod.yml --env-file .env.prod \
              run --rm backend npx prisma migrate deploy

            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            # Убираем образы прошлых версий, чтобы не забить диск.
            docker image prune -f

      - name: Проверка, что прод действительно жив
        # Без этого шага упавший после деплоя сервис остался бы зелёным в Actions.
        run: |
          set -e
          echo "Ждём, пока сервисы поднимутся…"
          for i in $(seq 1 12); do
            if curl -fsS "https://${{ vars.API_DOMAIN }}/health" > /dev/null; then
              break
            fi
            if [ "$i" = "12" ]; then
              echo "::error::API не отвечает на /health после деплоя"
              exit 1
            fi
            sleep 5
          done

          echo "Ответ /health:"
          curl -fsS "https://${{ vars.API_DOMAIN }}/health"
          echo

          echo "Проверяем фронтенд…"
          curl -fsS -o /dev/null "https://${{ vars.APP_DOMAIN }}"
          echo "Деплой успешен."
